name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates expo-env.d.ts, which is gitignored but required by
      # tsconfig. Without it, tsc cannot resolve the CSS module imports.
      # Rewrites tsconfig.json in place, but is idempotent.
      - name: Generate Expo types
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs even when the typecheck fails, so one run reports both.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

  doctor:
    name: Project health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Checks dependency versions against the installed SDK, plus app config
      # and native-folder consistency. Reaches the npm registry and Expo's
      # API, so it can go red on upstream releases with no change here.
      - name: Run expo-doctor
        run: npx expo-doctor

  functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned to the minor the committed lockfiles were written with.
          # A different minor can change the lockfile format, which
          # --frozen-lockfile below would then report as drift.
          deno-version: "~2.9"

      # Deliberately no `npm ci`. Deno resolves npm: specifiers inside a
      # node_modules directory when it finds one, rather than from its own
      # cache, and then fails on packages the app does not have. The functions
      # need none of the app's dependencies, so the directory is better absent.
      #
      # Each function is checked from its own directory because Deno discovers
      # deno.json by searching upward from the working directory, not from the
      # file being checked. Run from the repository root it would find no
      # config at all.
      - name: Typecheck edge functions
        run: |
          for dir in supabase/functions/*/; do
            [ -f "${dir}deno.json" ] || continue
            echo "--- ${dir}index.ts"
            ( cd "$dir" && deno check --frozen-lockfile index.ts )
          done

  bundle:
    name: iOS bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bundles the app exactly as a real build does, so this catches broken
      # imports, missing assets and Metro resolution errors that neither the
      # typecheck nor the linter sees. Needs no Mac and no EAS account.
      - name: Export iOS bundle
        run: npx expo export --platform ios
